<!-- VANTA.NET Background Animation (Stars/Dots) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
<script>
  VANTA.NET({
    el: "body",              // attach to body
    mouseControls: true,
    touchControls: true,
    gyroControls: false,
    minHeight: 200.00,
    minWidth: 200.00,
    scale: 1.00,
    scaleMobile: 1.00,
    color: 0x9A57C0,         // purple dots
    backgroundColor: 0x0a0a16, // deep dark blue-black
    points: 15.00,           // more points for star effect
    maxDistance: 30.00,
    spacing: 20.00,
    showDots: true
  });
</script>
